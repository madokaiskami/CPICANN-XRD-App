name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f docker/Dockerfile.cpu -t cpicann-xrd-app:test .

      - name: Build XDecomposer worker image
        run: docker build -f docker/Dockerfile.xdecomposer -t xdecomposer-service:test .

      - name: Check CLI version
        run: docker run --rm cpicann-xrd-app:test cpicann-xrd --version

      - name: Run FakeBackend doctor
        run: docker run --rm cpicann-xrd-app:test cpicann-xrd doctor --backend fake

      - name: Validate compose file
        run: docker compose config

      - name: Validate XDecomposer compose overlay
        run: docker compose -f compose.yaml -f compose.xdecomposer.yaml config

  publish:
    runs-on: ubuntu-latest
    needs: build-smoke
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push CPU image
        id: build-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push XDecomposer worker image
        id: build-xdecomposer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.xdecomposer
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-xdecomposer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-xdecomposer:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record image digests
        run: |
          echo "CPICANN image digest: ${{ steps.build-cpu.outputs.digest }}"
          echo "XDecomposer image digest: ${{ steps.build-xdecomposer.outputs.digest }}"
