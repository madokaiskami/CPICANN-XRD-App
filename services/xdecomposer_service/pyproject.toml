[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xdecomposer-service"
version = "0.1.0"
description = "Isolated XDecomposer runtime health and asset gate service."
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.115.14",
    "numpy>=1.26,<3",
    "pydantic==2.13.4",
    "torch==2.10.0",
    "PyYAML==6.0.3",
    "uvicorn[standard]==0.51.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xdecomposer_service"]
