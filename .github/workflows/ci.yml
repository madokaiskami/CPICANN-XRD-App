name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check CLI version
        run: uv run cpicann-xrd --version

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q -m "not model and not xdecomposer_model and not xdecomposer_cpicann_model"

      - name: Release preflight
        run: uv run python scripts/release_preflight.py --json

      - name: Export runtime dependency inventory
        run: uv export --format requirements.txt --no-dev --no-emit-project --no-hashes --no-header --frozen --output-file dependency-inventory.txt > /dev/null

      - name: Export CycloneDX SBOM
        run: uv export --format cyclonedx1.5 --no-dev --no-emit-project --frozen --output-file sbom.cdx.json > /dev/null

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          uvx pip-audit --requirement dependency-inventory.txt --format json --output dependency-audit.json

      - name: Upload supply-chain reports
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: |
            dependency-inventory.txt
            sbom.cdx.json
            dependency-audit.json
