[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cpicann-xrd"
version = "0.1.0rc1"
description = "Reproducible XRD phase-identification application around CPICANN."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "CPICANN-XRD-App contributors" }]
keywords = ["xrd", "cpicann", "phase-identification", "materials-science"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "pymatgen>=2024.10,<2027",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.2,<7",
    "streamlit>=1.40,<2",
    "torch>=2.5,<3",
    "typer>=0.12.5,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1,<2",
    "mypy>=1.11.2,<2",
    "pytest>=8.3.3,<9",
    "pytest-cov>=5.0.0,<7",
    "ruff>=0.6.9,<1",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
cpicann-xrd = "cpicann_xrd.cli:main"

[project.urls]
Repository = "https://github.com/madokaiskami/CPICANN-XRD-App"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.sdist]
include = [
    "/AGENTS.md",
    "/CITATION.cff",
    "/DEVELOPMENT_PLAN.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/docs",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cpicann_xrd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "model: requires configured real CPICANN model weights",
    "xdecomposer_model: requires configured real XDecomposer assets",
]

[tool.coverage.run]
branch = true
source = ["cpicann_xrd"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = []
