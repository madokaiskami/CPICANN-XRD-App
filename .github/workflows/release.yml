name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build source and wheel distributions
        run: uv run python -m build

      - name: Release preflight
        run: uv run python scripts/release_preflight.py --json

      - name: Generate distribution checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push release XDecomposer worker image
        id: build-xdecomposer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.xdecomposer
          push: true
          tags: ${{ env.IMAGE_NAME }}-xdecomposer:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Write image digests
        run: |
          {
            echo "cpicann_app=${{ steps.build-cpu.outputs.digest }}"
            echo "xdecomposer_worker=${{ steps.build-xdecomposer.outputs.digest }}"
          } > dist/IMAGE_DIGESTS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
